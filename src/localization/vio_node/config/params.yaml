vio_node:
  ros__parameters:
    image_topic: /camera/color/image_raw
    camera_info_topic: /camera/color/camera_info
    imu_topic: /imu/data_raw
    odom_topic: /vio/odometry

    odom_frame: odom
    base_frame: base_link
    publish_tf: true

    # CameraInfo takes precedence after it arrives. These zero defaults make the
    # node wait instead of silently using made-up intrinsics.
    fx: 0.0
    fy: 0.0
    cx: 0.0
    cy: 0.0

    max_features: 300
    min_tracked_features: 35
    feature_quality: 0.01
    feature_min_distance: 12.0
    ransac_probability: 0.999
    ransac_threshold_pixels: 1.5
    max_visual_rotation_rad: 0.7
    visual_processing_rate_hz: 5.0
    image_processing_scale: 0.5

    # The IMU supplies metric scale; visual measurements correct drift.
    visual_orientation_weight: 0.20
    visual_translation_weight: 0.25
    visual_velocity_weight: 0.10
    maximum_visual_translation_m: 2.0

    gravity_mps2: 9.80665
    calibrate_on_startup: true
    initialization_samples: 20
    max_imu_gap_sec: 0.25
    max_image_gap_sec: 1.0

    # Rotations map sensor-frame vectors into base_link. The camera default is
    # the standard ROS optical frame (x right, y down, z forward) to base frame
    # (x forward, y left, z up). Measure and replace these for the final mount.
    camera_to_body_rotation_rpy: [-1.57079632679, 0.0, -1.57079632679]
    imu_to_body_rotation_rpy: [0.0, 0.0, 0.0]

    position_variance: 0.05
    orientation_variance: 0.02
    linear_velocity_variance: 0.10
    angular_velocity_variance: 0.02
