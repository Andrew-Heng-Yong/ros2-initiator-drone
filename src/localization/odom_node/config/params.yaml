odom_node:
  ros__parameters:
    imu_topic: /imu/data_raw
    calibrated_imu_topic: /imu/data_calibrated
    odom_topic: /odom
    calibration_status_topic: /odom/calibrated
    calibration_service: /odom/calibrate
    flow_topic: /optical_flow/raw
    range_topic: /range/down

    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    # Bench-only mode: publish a fixed, calibrated origin pose with observed
    # position covariance. Disable before the robot can move.
    static_override: false
    # Force position confidence low enough for visualization clients regardless
    # of inertial drift. This changes reported quality only.
    quality_override: false
    # Keep translation tied to external observations. When flow/range is
    # unavailable, hold position and report it unobserved instead of double
    # integrating accelerometer noise into false motion. Enable only for
    # experimental IMU dead reckoning, which will drift without a reference.
    integrate_linear_acceleration: false
    # Learn accelerometer gain from stationary gravity. This also handles
    # MPU-compatible boards whose effective range differs from readback.
    auto_scale_acceleration: true
    # Smooth both gyro and acceleration with a rolling mean while retaining the
    # original publication rate. Ten reads add about 45 ms mean delay at 100 Hz.
    imu_average_window_size: 10

    gyro_deadband_rad_s: 0.005
    # Every node startup automatically learns gyro bias, gravity direction,
    # and accelerometer scale from this many stationary averaged readings.
    startup_initialization_samples: 1000
    initialization_samples: 200
    # Sanity cap for the zero-rate bias magnitude. Stationarity is primarily
    # decided from sample variation so a stable sensor offset can be learned.
    max_calibration_angular_speed_rad_s: 0.50
    max_calibration_gyro_stddev_rad_s: 0.03
    # Warning threshold only. Accelerometer noise no longer blocks gyro calibration.
    max_calibration_accel_stddev_m_s2: 0.25
    max_imu_gap_sec: 0.25
    # Preserve gentle vehicle acceleration while filtering sensor noise.
    acceleration_deadband_m_s2: 0.03
    acceleration_filter_time_constant_sec: 0.08
    velocity_damping_per_sec: 0.05
    max_linear_acceleration_m_s2: 15.0
    max_linear_speed_m_s: 5.0

    # External translation aiding. Flow counts are converted to planar body
    # velocity using the live downward range, then blended with inertial velocity.
    use_optical_flow: true
    minimum_flow_quality: 25
    maximum_flow_shutter: 7999
    # Calibrated from the 2026-08-15 suspended-swing blackbox. The dominant
    # roll axis measured about 666 flow counts/radian (0.00150 rad/count).
    flow_radians_per_count: 0.0015
    flow_velocity_gain: 0.65
    # Remove apparent planar motion caused by roll/pitch rotation of the
    # downward camera. Set to 0 only for diagnostics.
    flow_rotation_compensation_gain: 1.0
    flow_timeout_sec: 0.20
    # Reject flow during fast rotation instead of treating rotational image
    # motion as translation.
    # The swing replay showed phase-dependent residuals above 0.30 rad/s even
    # after rotation compensation, so do not integrate those samples as travel.
    max_flow_angular_speed_rad_s: 0.30
    max_flow_linear_speed_m_s: 5.0
    # [body_vx from dx, body_vx from dy, body_vy from dx, body_vy from dy].
    # Change signs/order after a simple forward/left bench translation test.
    flow_to_body_matrix: [0.0, -1.0, 1.0, 0.0]
    # Vector from the base_link origin to the optical-flow sensor, expressed in
    # base_link axes (x forward, y left, z up). The estimator removes omega x r
    # so rotation about the drone origin is not reported as planar translation.
    flow_position_offset_m: [0.0, 0.0, 0.0]

    # Downward range is fused as relative Z. The first valid post-calibration
    # sample defines Z=0 unless range_reference_distance_m is set explicitly.
    use_rangefinder: true
    range_position_gain: 0.25
    range_velocity_gain: 0.20
    range_timeout_sec: 0.20
    maximum_range_vertical_speed_m_s: 3.0
    maximum_range_innovation_m: 0.75
    minimum_range_vertical_projection: 0.50
    range_reference_distance_m: -1.0

    # Rotation from the mounted IMU frame into base_link (x forward, y left,
    # z up). 
    imu_to_body_rotation_rpy: [0.0, 0.0, 0.0]
    # Vector from the base_link origin to the IMU, expressed in base_link axes.
    # Tangential and centripetal lever-arm acceleration are removed before
    # inertial translation is integrated and /imu/data_calibrated is published.
    imu_position_offset_m: [0.0, 0.0, 0.0]

    # Used when acceleration integration is disabled.
    unobserved_position_variance: 1000000.0
    # Translation variance advertised only while static_override is active.
    static_position_variance: 0.01
    # Translation variance advertised while quality_override is active.
    quality_override_position_variance: 0.01
    initial_orientation_variance: 0.01
    angular_velocity_variance: 0.02
    linear_acceleration_variance: 0.10
    initial_inertial_position_variance: 0.25
    position_variance_growth_per_sec: 0.25
    flow_velocity_variance: 0.04
    range_position_variance: 0.01
    range_velocity_variance: 0.04
